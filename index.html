<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#edecea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Memories</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

<div id="dots" aria-hidden="true"></div>

<!-- HOME ─────────────────────────────────── -->
<main id="home">
  <header class="header">
    <p class="header__date" id="header-date"></p>
    <h1 class="header__title">Memories</h1>
    <p class="header__count" id="header-count"></p>
  </header>
  <section class="grid" id="grid" aria-label="Memory collection"></section>
</main>

<button id="fab" aria-label="Capture new object"><svg class="icon" aria-hidden="true"><use href="#i-add"/></svg></button>

<!-- STEP 1 — CAMERA ──────────────────────── -->
<div id="camera-overlay" class="overlay" role="dialog" aria-label="Camera">
  <button class="btn-close" id="camera-close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  <video id="camera-video" autoplay playsinline muted></video>
  <div class="cam-denied" id="cam-denied">
    <span><svg class="icon" aria-hidden="true"><use href="#i-photo-camera"/></svg></span>
    <span>Camera access denied.<br>Allow camera in settings, or pick a photo from your gallery.</span>
  </div>
  <div class="cam-controls">
    <button id="gallery-btn" aria-label="Choose from gallery"><svg class="icon" aria-hidden="true"><use href="#i-photo-library"/></svg></button>
    <button id="shutter-btn" aria-label="Take photo"></button>
    <span class="cam-spacer"></span>
  </div>
  <input type="file" id="gallery-input" accept="image/*" hidden />
</div>

<!-- STEP 2 — PROCESSING ──────────────────── -->
<div id="processing-overlay" class="overlay" role="status" aria-label="Removing background">
  <div class="progress-ring">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="progress-ring__track" cx="50" cy="50" r="44" />
      <circle class="progress-ring__bar" id="progress-bar" cx="50" cy="50" r="44" />
    </svg>
    <span class="progress-ring__pct" id="progress-pct">0%</span>
  </div>
  <p class="processing-label" id="processing-label">Removing background</p>
  <p class="processing-sub" id="processing-sub">Just a moment</p>
</div>

<!-- STEP 3 — REVIEW ──────────────────────── -->
<div id="review-overlay" class="overlay" role="dialog" aria-label="Review capture">
  <button class="btn-close" id="review-close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  <div class="review-img-wrap">
    <img id="review-img" src="" alt="Captured object" />
  </div>
  <input id="name-input" type="text" placeholder="Name this object…"
         maxlength="40" autocomplete="off" autocorrect="off"
         autocapitalize="words" spellcheck="false" />
  <div class="review-actions">
    <button id="retake-btn" aria-label="Retake photo"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
    <button id="save-btn">Save to Memories</button>
  </div>
</div>

<!-- DETAIL VIEW ──────────────────────────── -->
<div id="detail-overlay" class="overlay" role="dialog" aria-label="Object detail">
  <button class="btn-close" id="detail-close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  <div class="detail-img-wrap">
    <img id="detail-img" src="" alt="" />
  </div>
  <input class="detail-name" id="detail-name" aria-label="Name" maxlength="60" />
  <p class="detail-date" id="detail-date"></p>
  <textarea class="detail-note" id="detail-note" rows="3" maxlength="1000"
    placeholder="Add the story behind it…" aria-label="Story"></textarea>
  <button class="detail-delete" id="detail-delete" aria-label="Delete"><svg class="icon" aria-hidden="true"><use href="#i-delete"/></svg></button>
</div>

<canvas id="capture-canvas" style="display:none"></canvas>

<script src="vendor/native.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
