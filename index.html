<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#edecea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Memories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    /* ── Tokens ──────────────────────────────────────────────────── */
    :root {
      --color-bg:             #edecea;
      --color-dot:            #ccc8c2;
      --color-text-primary:   #111111;
      --color-text-secondary: #888888;
      --color-text-tertiary:  #bbbbbb;
      --color-accent:         #f5a742;
      --color-camera-bg:      #000000;

      --font:         -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-display: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --fs-xs: 11px; --fs-sm: 13px; --fs-base: 14px; --fs-md: 15px; --fs-xl: 28px;
      --fw-reg: 400; --fw-semi: 700; --fw-bold: 900;

      --sp-sm: 8px; --sp-md: 12px; --sp-lg: 16px;
      --sp-xl: 20px; --sp-2xl: 24px; --sp-3xl: 32px;

      --r-md: 20px; --r-full: 50%;
      --sh-object: drop-shadow(0 6px 18px rgba(0,0,0,0.14));
      --sh-fab: 0 6px 20px rgba(245,167,66,0.35);
      --tx-base: 0.2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      overflow: hidden;
      max-width: 430px;
      margin: 0 auto;
      position: relative;
    }

    #dots {
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle, var(--color-dot) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    /* ═══════════════════════════════════════
       HOME / GRID
    ═══════════════════════════════════════ */
    #home {
      position: fixed;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; bottom: 0;
      z-index: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding:
        calc(var(--sp-2xl) + env(safe-area-inset-top,    0px))
        calc(var(--sp-lg)  + env(safe-area-inset-right,  0px))
        calc(90px          + env(safe-area-inset-bottom, 0px))
        calc(var(--sp-lg)  + env(safe-area-inset-left,   0px));
    }

    .header { margin-bottom: var(--sp-3xl); }
    .header__date  { font-size: var(--fs-sm); color: var(--color-text-secondary); margin-bottom: 4px; }
    .header__title { font-size: var(--fs-xl); font-weight: var(--fw-reg); letter-spacing: -0.5px; line-height: 1.15; }
    .header__count { font-size: var(--fs-sm); color: var(--color-text-secondary); margin-top: 4px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--sp-lg); row-gap: var(--sp-3xl); }

    .card { cursor: pointer; user-select: none; transition: transform var(--tx-base); display: flex; flex-direction: column; align-items: center; }
    .card:active { transform: scale(0.97); }

    .card__img-wrap { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
    .card__img-wrap img {
      width: 90%; height: 90%; object-fit: contain; mix-blend-mode: multiply;
      /* Soft white outline around object — sticker effect */
      filter:
        drop-shadow( 2px  0px  0 #fff)
        drop-shadow(-2px  0px  0 #fff)
        drop-shadow( 0px  2px  0 #fff)
        drop-shadow( 0px -2px  0 #fff)
        drop-shadow( 1.5px  1.5px 0 #fff)
        drop-shadow(-1.5px  1.5px 0 #fff)
        drop-shadow( 1.5px -1.5px 0 #fff)
        drop-shadow(-1.5px -1.5px 0 #fff)
        drop-shadow(0 6px 18px rgba(0,0,0,0.12));
    }

    .card__name {
      font-family: var(--font-display); font-size: var(--fs-md); font-weight: var(--fw-bold);
      letter-spacing: -0.2px; color: var(--color-text-primary);
      text-align: center; margin-top: var(--sp-sm); line-height: 1.2;
      /* Thick white stroke — sticker/CapWords style */
      -webkit-text-stroke: 4px #fff;
      paint-order: stroke fill;
    }
    .card__date  { font-size: var(--fs-xs); color: var(--color-text-tertiary); text-align: center; margin-top: 4px; }

    /* FAB */
    #fab {
      position: fixed;
      bottom: calc(var(--sp-2xl) + env(safe-area-inset-bottom, 0px));
      right: max(calc(var(--sp-xl) + env(safe-area-inset-right, 0px)), calc(50vw - 215px + var(--sp-xl)));
      width: 58px; height: 58px; border-radius: var(--r-full);
      background: var(--color-accent); box-shadow: var(--sh-fab);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: var(--fw-semi); color: #fff;
      z-index: 50; transition: transform var(--tx-base); user-select: none;
    }
    #fab:active { transform: scale(0.95); }

    /* ═══════════════════════════════════════
       SHARED OVERLAY BASE
    ═══════════════════════════════════════ */
    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: 100%;
      z-index: 200;
    }
    .overlay.active { display: flex; }

    /* Close / back button */
    .btn-close {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 16px;
      width: 40px; height: 40px; border-radius: var(--r-full);
      background: rgba(0,0,0,0.45); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; z-index: 10;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }

    /* ═══════════════════════════════════════
       STEP 1 — CAMERA
    ═══════════════════════════════════════ */
    #camera-overlay {
      background: var(--color-camera-bg);
      flex-direction: column;
    }

    #camera-video { flex: 1; width: 100%; object-fit: cover; display: block; transform: scaleX(-1); }

    .cam-denied {
      display: none; flex: 1; flex-direction: column;
      align-items: center; justify-content: center;
      color: #666; font-size: var(--fs-sm); text-align: center; padding: 32px; gap: 12px;
    }
    .cam-denied.visible { display: flex; }
    .cam-denied span:first-child { font-size: 40px; }

    .cam-controls {
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      padding: 24px 0 calc(36px + env(safe-area-inset-bottom, 0px));
      background: var(--color-camera-bg);
    }

    #shutter-btn {
      width: 72px; height: 72px; border-radius: var(--r-full);
      background: #fff; border: none; cursor: pointer;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.25), 0 0 0 7px rgba(255,255,255,0.1);
      transition: transform var(--tx-base), background var(--tx-base);
      outline: none;
    }
    #shutter-btn:active { transform: scale(0.91); background: #ccc; }

    /* ═══════════════════════════════════════
       STEP 2 — SCISSORS CUT ANIMATION
    ═══════════════════════════════════════ */
    #processing-overlay {
      background: var(--color-bg);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    /* Image preview with scissors cutting around it */
    .cut-stage {
      position: relative;
      width: 240px;
      height: 240px;
    }

    /* The photo being "cut" */
    .cut-stage__img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 20px;
      display: block;
    }

    /* SVG overlay */
    .cut-stage__svg {
      position: absolute;
      inset: -12px;
      width: calc(100% + 24px);
      height: calc(100% + 24px);
      overflow: visible;
    }

    /* Layer 1 — full dashed line always visible from the start */
    .cut-trace {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 8 7;
      opacity: 0.35;
      filter: drop-shadow(0 0 3px rgba(245,167,66,0.4));
    }

    /* Layer 2 — bright solid segment that lights up where scissors has been */
    .cut-done {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 942;
      stroke-dashoffset: 942;
      animation: grow-done 2.8s linear infinite;
      filter: drop-shadow(0 0 5px rgba(245,167,66,0.7));
    }
    @keyframes grow-done {
      0%   { stroke-dashoffset: 942; opacity: 0; }
      4%   { stroke-dashoffset: 942; opacity: 1; }
      95%  { stroke-dashoffset: 0;   opacity: 1; }
      99%  { stroke-dashoffset: 0;   opacity: 0; }
      100% { stroke-dashoffset: 942; opacity: 0; }
    }

    /* Scissors — follows the line, same 2.8s */
    .cut-scissors {
      position: absolute;
      font-size: 22px;
      line-height: 1;
      offset-path: path('M22,12 L222,12 Q234,12 234,24 L234,222 Q234,234 222,234 L22,234 Q12,234 12,222 L12,24 Q12,12 22,12 Z');
      offset-distance: 0%;
      offset-rotate: auto;
      animation: scissors-ride 2.8s linear infinite;
    }
    @keyframes scissors-ride {
      0%   { offset-distance: 0%;   }
      100% { offset-distance: 100%; }
    }

    .processing-label {
      font-family: var(--font-display);
      font-size: var(--fs-md); font-weight: var(--fw-bold);
      color: var(--color-text-primary);
    }
    .processing-sub {
      font-size: var(--fs-sm); color: var(--color-text-secondary); text-align: center;
      margin-top: -16px;
    }

    /* ═══════════════════════════════════════
       STEP 3 — REVIEW (name + confirm)
    ═══════════════════════════════════════ */
    #review-overlay {
      background: var(--color-bg);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        calc(72px + env(safe-area-inset-top, 0px))
        var(--sp-2xl)
        calc(var(--sp-2xl) + env(safe-area-inset-bottom, 0px));
      gap: 0;
    }

    /* Object preview — floats on grey, no container */
    .review-img-wrap {
      width: 72%; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: var(--sp-3xl);
    }
    .review-img-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter: var(--sh-object);
      mix-blend-mode: multiply;
    }

    /* Name input */
    #name-input {
      width: 100%;
      font-family: var(--font-display);
      font-size: 22px; font-weight: var(--fw-bold);
      text-align: center; color: var(--color-text-primary);
      background: transparent; border: none;
      border-bottom: 2px solid rgba(0,0,0,0.1);
      padding: 8px 4px 10px;
      outline: none;
      margin-bottom: var(--sp-3xl);
    }
    #name-input::placeholder { color: var(--color-text-tertiary); }
    #name-input:focus { border-bottom-color: var(--color-accent); }

    /* Action buttons row */
    .review-actions {
      display: flex; align-items: center; justify-content: center;
      gap: var(--sp-xl); width: 100%;
    }

    /* Retake — grey circle */
    #retake-btn {
      width: 52px; height: 52px; border-radius: var(--r-full);
      background: #e2dfdb; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      transition: transform var(--tx-base);
    }
    #retake-btn:active { transform: scale(0.94); }

    /* Save — orange pill */
    #save-btn {
      flex: 1; max-width: 200px;
      height: 52px; border-radius: 26px;
      background: var(--color-accent); border: none; cursor: pointer;
      font-family: var(--font-display);
      font-size: var(--fs-base); font-weight: var(--fw-bold);
      color: #fff; letter-spacing: 0.3px;
      box-shadow: var(--sh-fab);
      transition: transform var(--tx-base);
    }
    #save-btn:active { transform: scale(0.96); }

    /* ═══════════════════════════════════════
       DETAIL VIEW
    ═══════════════════════════════════════ */
    #detail-overlay {
      background: var(--color-bg);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        calc(72px + env(safe-area-inset-top, 0px))
        var(--sp-2xl)
        calc(var(--sp-2xl) + env(safe-area-inset-bottom, 0px));
      gap: 0;
    }

    .detail-img-wrap {
      width: 78%; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 32px;
    }
    .detail-img-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
      filter:
        drop-shadow( 2px  0px  0 #fff)
        drop-shadow(-2px  0px  0 #fff)
        drop-shadow( 0px  2px  0 #fff)
        drop-shadow( 0px -2px  0 #fff)
        drop-shadow(0 8px 28px rgba(0,0,0,0.13));
    }

    .detail-name {
      font-family: var(--font-display);
      font-size: 28px; font-weight: var(--fw-bold);
      letter-spacing: -0.5px; color: var(--color-text-primary);
      text-align: center; line-height: 1.15;
      -webkit-text-stroke: 4px #fff;
      paint-order: stroke fill;
      margin-bottom: 8px;
    }
    .detail-date {
      font-size: var(--fs-sm); color: var(--color-text-secondary);
      text-align: center;
    }

    /* delete button */
    .detail-delete {
      margin-top: 40px;
      width: 44px; height: 44px; border-radius: var(--r-full);
      background: rgba(0,0,0,0.06); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--color-text-secondary);
      transition: background var(--tx-base), color var(--tx-base);
    }
    .detail-delete:active { background: rgba(220,60,60,0.12); color: #c0392b; }

    /* ═══════════════════════════════════════
       EMPTY STATE
    ═══════════════════════════════════════ */
    .empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      padding: 60px 32px;
      text-align: center;
    }
    .empty__icon { font-size: 52px; line-height: 1; margin-bottom: 4px; }
    .empty__title {
      font-family: var(--font-display);
      font-size: 20px; font-weight: var(--fw-bold);
      color: var(--color-text-primary);
      -webkit-text-stroke: 3px #fff; paint-order: stroke fill;
    }
    .empty__sub {
      font-size: var(--fs-sm); color: var(--color-text-secondary);
      line-height: 1.5; max-width: 220px;
    }
  </style>
</head>
<body>

<div id="dots" aria-hidden="true"></div>

<!-- HOME ─────────────────────────────────── -->
<main id="home">
  <header class="header">
    <p class="header__date" id="header-date"></p>
    <h1 class="header__title">Memories</h1>
    <p class="header__count" id="header-count"></p>
  </header>
  <section class="grid" id="grid" aria-label="Memory collection"></section>
</main>

<button id="fab" aria-label="Capture new object">+</button>

<!-- STEP 1 — CAMERA ──────────────────────── -->
<div id="camera-overlay" class="overlay" role="dialog" aria-label="Camera">
  <button class="btn-close" id="camera-close" aria-label="Close">✕</button>
  <video id="camera-video" autoplay playsinline muted></video>
  <div class="cam-denied" id="cam-denied">
    <span>📷</span>
    <span>Camera access denied.<br>Allow camera in browser settings and try again.</span>
  </div>
  <div class="cam-controls">
    <button id="shutter-btn" aria-label="Take photo"></button>
  </div>
</div>

<!-- STEP 2 — PROCESSING ──────────────────── -->
<div id="processing-overlay" class="overlay" role="status" aria-label="Removing background">
  <div class="cut-stage">
    <img id="proc-preview" class="cut-stage__img" src="" alt="" />
    <svg class="cut-stage__svg" viewBox="0 0 246 246" xmlns="http://www.w3.org/2000/svg">
      <!-- faint dashed guide — full line visible from start, scissors follows it -->
      <path class="cut-trace"
        d="M22,12 L222,12 Q234,12 234,24 L234,222 Q234,234 222,234 L22,234 Q12,234 12,222 L12,24 Q12,12 22,12 Z" />
      <!-- bright solid segment lights up where scissors has already cut -->
      <path class="cut-done"
        d="M22,12 L222,12 Q234,12 234,24 L234,222 Q234,234 222,234 L22,234 Q12,234 12,222 L12,24 Q12,12 22,12 Z" />
    </svg>
    <div class="cut-scissors">✂️</div>
  </div>
  <p class="processing-label">Cutting background…</p>
  <p class="processing-sub">Just a moment</p>
</div>

<!-- STEP 3 — REVIEW ──────────────────────── -->
<div id="review-overlay" class="overlay" role="dialog" aria-label="Review capture">
  <button class="btn-close" id="review-close" aria-label="Close">✕</button>
  <div class="review-img-wrap">
    <img id="review-img" src="" alt="Captured object" />
  </div>
  <input id="name-input" type="text" placeholder="Name this object…"
         maxlength="40" autocomplete="off" autocorrect="off"
         autocapitalize="words" spellcheck="false" />
  <div class="review-actions">
    <button id="retake-btn" aria-label="Retake photo">↺</button>
    <button id="save-btn">Save to Memories</button>
  </div>
</div>

<!-- DETAIL VIEW ──────────────────────────── -->
<div id="detail-overlay" class="overlay" role="dialog" aria-label="Object detail">
  <button class="btn-close" id="detail-close" aria-label="Close">✕</button>
  <div class="detail-img-wrap">
    <img id="detail-img" src="" alt="" />
  </div>
  <p class="detail-name" id="detail-name"></p>
  <p class="detail-date" id="detail-date"></p>
  <button class="detail-delete" id="detail-delete" aria-label="Delete">🗑</button>
</div>

<canvas id="capture-canvas" style="display:none"></canvas>

<script>
'use strict';

/* ════════════════════════════════════════════════
   STORAGE
════════════════════════════════════════════════ */
const STORAGE_KEY = 'memories_collection';

function loadMemories() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function saveMemories(arr) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }
  catch (e) { console.warn('localStorage full:', e); }
}

/* ════════════════════════════════════════════════
   DATE HELPERS
════════════════════════════════════════════════ */
const fmtShort = d => d.toLocaleDateString('en-US', { month:'long', day:'numeric' });
const fmtFull  = d => d.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });

/* ════════════════════════════════════════════════
   SEED DATA (shown on first visit)
════════════════════════════════════════════════ */
const SEED = [
  { id:1, name:'Vintage Key',  date:'May 21, 2026', image:'assets/key.png' },
  { id:2, name:'Blue Teapot',  date:'May 19, 2026', image:'assets/teapot.png' },
  { id:3, name:'Croissant',    date:'May 16, 2026', image:'assets/croissant.png' },
  { id:4, name:'Rubber Duck',  date:'May 13, 2026', image:'assets/duck.png' },
];

function initializeIfEmpty() {
  if (loadMemories().length === 0) {
    saveMemories(SEED);
  }
}

/* ════════════════════════════════════════════════
   RENDER GRID
════════════════════════════════════════════════ */
function renderGrid() {
  const memories = loadMemories().slice().reverse();
  const grid = document.getElementById('grid');

  document.getElementById('header-date').textContent  = fmtShort(new Date());
  document.getElementById('header-count').textContent =
    `${memories.length} object${memories.length !== 1 ? 's' : ''} collected`;

  if (memories.length === 0) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="empty__icon">📦</div>
        <p class="empty__title">Nothing here yet</p>
        <p class="empty__sub">Tap + to capture your first object and start your collection</p>
      </div>`;
    return;
  }

  grid.innerHTML = memories.map(m => `
    <div class="card" role="button" tabindex="0" aria-label="${esc(m.name)}" data-id="${m.id}">
      <div class="card__img-wrap">
        <img src="${m.image}" alt="${esc(m.name)}" loading="lazy" decoding="async" />
      </div>
      <p class="card__name">${esc(m.name)}</p>
      <p class="card__date">${m.date}</p>
    </div>
  `).join('');

  // Tap card → detail view
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openDetail(card.dataset.id));
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ════════════════════════════════════════════════
   DETAIL VIEW
════════════════════════════════════════════════ */
function openDetail(id) {
  const memories = loadMemories();
  const m = memories.find(x => String(x.id) === String(id));
  if (!m) return;

  document.getElementById('detail-img').src   = m.image;
  document.getElementById('detail-img').alt   = m.name;
  document.getElementById('detail-name').textContent = m.name;
  document.getElementById('detail-date').textContent = m.date;
  document.getElementById('detail-delete').dataset.id = m.id;

  showOverlay('detail-overlay');
}

function closeDetail() {
  hideOverlay('detail-overlay');
  document.getElementById('fab').style.display = 'flex';
  document.getElementById('detail-img').src = '';
}

function deleteMemory(id) {
  const updated = loadMemories().filter(m => String(m.id) !== String(id));
  saveMemories(updated);
  closeDetail();
  renderGrid();
}

/* ════════════════════════════════════════════════
   OVERLAY HELPERS
════════════════════════════════════════════════ */
function showOverlay(id) {
  document.getElementById(id).classList.add('active');
  document.getElementById('fab').style.display = 'none';
}
function hideOverlay(id) {
  document.getElementById(id).classList.remove('active');
}
function hideAll() {
  ['camera-overlay','processing-overlay','review-overlay','detail-overlay'].forEach(hideOverlay);
  document.getElementById('fab').style.display = 'flex';
}

/* ════════════════════════════════════════════════
   STEP 1 — CAMERA
════════════════════════════════════════════════ */
let stream = null;

async function openCamera() {
  const video  = document.getElementById('camera-video');
  const denied = document.getElementById('cam-denied');

  showOverlay('camera-overlay');
  denied.classList.remove('visible');
  video.style.display = 'block';

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal:'environment' }, width:{ideal:1920}, height:{ideal:1920} },
      audio: false,
    });
    video.srcObject = stream;
  } catch (err) {
    console.warn('[camera]', err.name);
    video.style.display = 'none';
    denied.classList.add('visible');
  }
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('camera-video').srcObject = null;
}

function captureFrame() {
  const video  = document.getElementById('camera-video');
  const canvas = document.getElementById('capture-canvas');
  const vw = video.videoWidth  || 1280;
  const vh = video.videoHeight || 1280;
  const side = Math.min(vw, vh);
  canvas.width = canvas.height = 1024;
  const ctx = canvas.getContext('2d');
  // Mirror horizontally to match the flipped preview
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, (vw-side)/2, (vh-side)/2, side, side, -1024, 0, 1024, 1024);
  ctx.restore();
  return canvas.toDataURL('image/jpeg', 0.92);
}

/* ════════════════════════════════════════════════
   STEP 2 — BACKGROUND REMOVAL via remove.bg API
   DEV_MODE: set true to skip API calls while testing UI
════════════════════════════════════════════════ */
const DEV_SKIP_BG = false; // ← flip to true to save credits while testing UI

async function removeBackground(jpegDataURL) {
  // Skip API during UI development
  if (DEV_SKIP_BG) {
    const res = await fetch(jpegDataURL);
    return res.blob();
  }

  // Convert data URL → Blob
  const res  = await fetch(jpegDataURL);
  const blob = await res.blob();

  // Build multipart form for remove.bg
  const form = new FormData();
  form.append('image_file', blob, 'photo.jpg');
  form.append('size', 'auto');

  console.log('[removebg] Sending to API...');

  const response = await fetch('https://api.remove.bg/v1.0/removebg', {
    method: 'POST',
    headers: { 'X-Api-Key': 'mkvyD4Lt9VciJAMLPwUip9Ws' },
    body: form,
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err?.errors?.[0]?.title || `remove.bg ${response.status}`);
  }

  console.log('[removebg] Done');
  return response.blob(); // PNG with transparent background
}

/* ════════════════════════════════════════════════
   STEP 3 — REVIEW
════════════════════════════════════════════════ */
let _pendingBlob = null;  // Blob for the bg-removed image

function showReview(blob) {
  // Revoke previous to avoid memory leaks
  if (_pendingBlob && _pendingBlob !== blob) {
    if (_pendingBlob instanceof Blob) {
      const url = document.getElementById('review-img').src;
      if (url.startsWith('blob:')) URL.revokeObjectURL(url);
    }
  }
  _pendingBlob = blob;

  const objectURL = URL.createObjectURL(blob);
  document.getElementById('review-img').src = objectURL;
  document.getElementById('name-input').value = '';
  document.getElementById('name-input').placeholder = 'Name this object…';

  hideOverlay('processing-overlay');
  showOverlay('review-overlay');

  // Auto-focus name input after short delay
  setTimeout(() => document.getElementById('name-input').focus(), 300);
}

/* ════════════════════════════════════════════════
   STEP 4 — SAVE TO LOCALSTORAGE
════════════════════════════════════════════════ */
async function saveMemory() {
  const name = document.getElementById('name-input').value.trim() || 'My Object';
  const blob = _pendingBlob;
  if (!blob) return;

  // Convert blob → base64 data URL for persistent storage
  const reader = new FileReader();

  reader.onload = () => {
    const dataURL = reader.result;
    const memories = loadMemories();
    const newMemory = {
      id:    Date.now(),
      name:  name,
      date:  fmtFull(new Date()),
      image: dataURL,
    };
    memories.push(newMemory);
    saveMemories(memories);

    _pendingBlob = null;

    hideAll();
    renderGrid();
  };
  reader.readAsDataURL(blob);
}

/* ════════════════════════════════════════════════
   FULL FLOW
════════════════════════════════════════════════ */
async function onShutterPressed() {
  if (!stream) return;

  // 1. Capture frame from video
  const jpegDataURL = captureFrame();
  stopCamera();
  hideOverlay('camera-overlay');

  // 2. Show processing overlay — set photo as cut-stage preview
  document.getElementById('proc-preview').src = jpegDataURL;
  showOverlay('processing-overlay');

  try {
    // 3. Remove background in browser
    const blob = await removeBackground(jpegDataURL);

    // 4. Show review screen
    showReview(blob);
  } catch (err) {
    console.error('[mediapipe]', err.message || err);
    alert(`⚠️ Background removal failed (${err.message || 'unknown error'})\n\nShowing original image. Check console for details.`);
    // Fallback: convert original JPEG to blob and show
    const res = await fetch(jpegDataURL);
    const fallbackBlob = await res.blob();
    showReview(fallbackBlob);
  }
}

/* ════════════════════════════════════════════════
   EVENTS
════════════════════════════════════════════════ */
document.getElementById('fab').addEventListener('click', openCamera);
document.getElementById('camera-close').addEventListener('click', () => { stopCamera(); hideAll(); });
document.getElementById('shutter-btn').addEventListener('click', onShutterPressed);
document.getElementById('review-close').addEventListener('click', hideAll);

// Retake: go back to camera
document.getElementById('retake-btn').addEventListener('click', () => {
  hideOverlay('review-overlay');
  openCamera();
});

// Save
document.getElementById('save-btn').addEventListener('click', saveMemory);

// Enter key in name field saves
document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); saveMemory(); }
});

// Detail view
document.getElementById('detail-close').addEventListener('click', closeDetail);
document.getElementById('detail-delete').addEventListener('click', e => {
  const id = e.currentTarget.dataset.id;
  if (confirm('Remove this memory?')) deleteMemory(id);
});

// Escape closes everything
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { stopCamera(); hideAll(); }
});

// Android hardware back button (only present when running as the native app)
const CapApp = window.Capacitor?.Plugins?.App;
if (CapApp) {
  CapApp.addListener('backButton', () => {
    const isActive = id => document.getElementById(id).classList.contains('active');
    if (isActive('processing-overlay')) return; // let background removal finish
    if (isActive('review-overlay'))  return document.getElementById('review-close').click();
    if (isActive('camera-overlay'))  return document.getElementById('camera-close').click();
    if (isActive('detail-overlay'))  return document.getElementById('detail-close').click();
    CapApp.exitApp();
  });
}


/* ════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════ */
initializeIfEmpty();
renderGrid();
</script>
