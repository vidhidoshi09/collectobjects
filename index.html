<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#edecea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Memories</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

<div id="dots" aria-hidden="true"></div>

<!-- HOME ─────────────────────────────────── -->
<main id="home">
  <header class="header">
    <p class="header__date" id="header-date"></p>
    <h1 class="header__title">Memories</h1>
    <p class="header__count" id="header-count"></p>
  </header>
  <section class="grid" id="grid" aria-label="Memory collection"></section>
</main>

<!-- Material Symbols Outlined, weight 400, grade 0, fill 0 (Apache-2.0, @material-symbols/svg-400;
     the package ships optical size 48 only), inlined so icons work offline -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-add" viewBox="0 -960 960 960"><path d="M450-450H200v-60h250v-250h60v250h250v60H510v250h-60v-250Z"/></symbol>
  <symbol id="i-arrow-back" viewBox="0 -960 960 960"><path d="m274-450 248 248-42 42-320-320 320-320 42 42-248 248h526v60H274Z"/></symbol>
  <symbol id="i-close" viewBox="0 -960 960 960"><path d="m249-207-42-42 231-231-231-231 42-42 231 231 231-231 42 42-231 231 231 231-42 42-231-231-231 231Z"/></symbol>
  <symbol id="i-photo-library" viewBox="0 -960 960 960"><path d="M345-377h391L609-548 506-413l-68-87-93 123Zm-85 177q-24 0-42-18t-18-42v-560q0-24 18-42t42-18h560q24 0 42 18t18 42v560q0 24-18 42t-42 18H260Zm0-60h560v-560H260v560ZM140-80q-24 0-42-18t-18-42v-620h60v620h620v60H140Zm120-740v560-560Z"/></symbol>
  <symbol id="i-refresh" viewBox="0 -960 960 960"><path d="M480-160q-133 0-226.5-93.5T160-480q0-133 93.5-226.5T480-800q85 0 149 34.5T740-671v-129h60v254H546v-60h168q-38-60-97-97t-137-37q-109 0-184.5 75.5T220-480q0 109 75.5 184.5T480-220q83 0 152-47.5T728-393h62q-29 105-115 169t-195 64Z"/></symbol>
  <symbol id="i-delete" viewBox="0 -960 960 960"><path d="M261-120q-24.75 0-42.37-17.63Q201-155.25 201-180v-570h-41v-60h188v-30h264v30h188v60h-41v570q0 24-18 42t-42 18H261Zm438-630H261v570h438v-570ZM367-266h60v-399h-60v399Zm166 0h60v-399h-60v399ZM261-750v570-570Z"/></symbol>
  <symbol id="i-photo-camera" viewBox="0 -960 960 960"><path d="M479.5-267q72.5 0 121.5-49t49-121.5q0-72.5-49-121T479.5-607q-72.5 0-121 48.5t-48.5 121q0 72.5 48.5 121.5t121 49Zm0-60q-47.5 0-78.5-31.5t-31-79q0-47.5 31-78.5t78.5-31q47.5 0 79 31t31.5 78.5q0 47.5-31.5 79t-79 31.5ZM140-120q-24 0-42-18t-18-42v-513q0-23 18-41.5t42-18.5h147l73-87h240l73 87h147q23 0 41.5 18.5T880-693v513q0 24-18.5 42T820-120H140Zm0-60h680v-513H645l-73-87H388l-73 87H140v513Zm340-257Z"/></symbol>
</svg>

<button class="fab ripple" id="fab" type="button" aria-label="New memory"><svg class="icon" aria-hidden="true"><use href="#i-add"/></svg></button>

<!-- STEP 1 — CAMERA ──────────────────────── -->
<div id="camera-overlay" class="overlay" role="dialog" aria-label="Camera">
  <button class="icon-btn icon-btn--camera ripple" id="camera-close" type="button" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  <video id="camera-video" autoplay playsinline muted></video>
  <div class="cam-denied" id="cam-denied">
    <svg class="icon icon--hero" aria-hidden="true"><use href="#i-photo-camera"/></svg>
    <p>Camera is off. Turn it on in Settings, or choose a photo instead.</p>
  </div>
  <div class="cam-controls">
    <button class="icon-btn icon-btn--camera icon-btn--large ripple" id="gallery-btn" type="button" aria-label="Choose a photo"><svg class="icon" aria-hidden="true"><use href="#i-photo-library"/></svg></button>
    <button class="ripple" id="shutter-btn" type="button" aria-label="Take photo"></button>
    <span class="cam-spacer"></span>
  </div>
  <input type="file" id="gallery-input" accept="image/*" hidden />
</div>

<!-- STEP 2 — PROCESSING ──────────────────── -->
<div id="processing-overlay" class="overlay" role="status" aria-live="polite">
  <div class="progress" role="progressbar" aria-labelledby="processing-label"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <circle class="progress__track" id="progress-track" cx="24" cy="24" r="22" />
      <circle class="progress__indicator" id="progress-bar" cx="24" cy="24" r="22" />
    </svg>
  </div>
  <p class="processing-label" id="processing-label">Cutting it out…</p>
  <p class="processing-pct" id="progress-pct">0%</p>
  <p class="processing-sub" id="processing-sub"></p>
</div>

<!-- STEP 3 — REVIEW ──────────────────────── -->
<div id="review-overlay" class="overlay overlay--page" role="dialog" aria-label="Name your memory">
  <header class="top-app-bar">
    <button class="icon-btn ripple" id="review-close" type="button" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  </header>
  <div class="page">
    <div class="page__content">
      <div class="review-img-wrap">
        <img class="sticker" id="review-img" src="" alt="Your photo" />
      </div>
      <div class="text-field">
        <input class="text-field__input" id="name-input" type="text" placeholder="Name it…"
               maxlength="40" autocomplete="off" autocorrect="off"
               autocapitalize="words" spellcheck="false" />
        <label class="text-field__label" for="name-input">Name</label>
      </div>
      <div class="review-actions snackbar-anchor">
        <button class="btn btn--tonal btn--icon ripple" id="retake-btn" type="button"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>Retake</button>
        <button class="btn btn--filled ripple" id="save-btn" type="button">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL VIEW ──────────────────────────── -->
<div id="detail-overlay" class="overlay overlay--page" role="dialog" aria-label="Memory">
  <header class="top-app-bar">
    <button class="icon-btn ripple" id="detail-close" type="button" aria-label="Back"><svg class="icon" aria-hidden="true"><use href="#i-arrow-back"/></svg></button>
    <span class="top-app-bar__spacer"></span>
    <button class="icon-btn ripple" id="detail-delete" type="button" aria-label="Delete"><svg class="icon" aria-hidden="true"><use href="#i-delete"/></svg></button>
  </header>
  <div class="page">
    <div class="page__content">
      <div class="detail-img-wrap">
        <img class="sticker" id="detail-img" src="" alt="" />
      </div>
      <input class="detail-name" id="detail-name" aria-label="Name" maxlength="60"
             autocomplete="off" spellcheck="false" />
      <p class="detail-date" id="detail-date"></p>
      <div class="text-field text-field--multiline">
        <textarea class="text-field__input" id="detail-note" rows="1" maxlength="1000"
                  placeholder="Add the story behind it…"></textarea>
        <label class="text-field__label" for="detail-note">Story</label>
      </div>
    </div>
  </div>
</div>

<!-- SNACKBAR ─────────────────────────────── -->
<div class="snackbar" id="snackbar" role="status" aria-live="polite">
  <p class="snackbar__text" id="snackbar-text"></p>
  <button class="snackbar__action ripple" id="snackbar-action" type="button" hidden></button>
</div>

<canvas id="capture-canvas" style="display:none"></canvas>

<script src="vendor/native.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
