<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#edecea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>collectobjects</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

<div id="dots" aria-hidden="true"></div>

<!-- HOME ─────────────────────────────────── -->
<main id="home">
  <header class="header">
    <p class="header__date overline" id="header-date"></p>
    <h1 class="header__title" data-copy="home.title"></h1>
    <p class="header__count" id="header-count"></p>
  </header>
  <section class="grid" id="grid" data-copy-aria="home.gridLabel"></section>
</main>

<!-- Material Symbols Rounded, weight 400, grade 0, fill 0 (Apache-2.0, @material-symbols/svg-400),

  <symbol id="i-refresh" viewBox="0 -960 960 960"><path d="M480-160q-133 0-226.5-93.5T160-480q0-133 93.5-226.5T480-800q85 0 149 34.5T740-671v-99q0-13 8.5-21.5T770-800q13 0 21.5 8.5T800-770v194q0 13-8.5 21.5T770-546H576q-13 0-21.5-8.5T546-576q0-13 8.5-21.5T576-606h138q-38-60-97-97t-137-37q-109 0-184.5 75.5T220-480q0 109 75.5 184.5T480-220q75 0 140-39.5T717-366q5-11 16.5-16.5t22.5-.5q12 5 16 16.5t-1 23.5q-39 84-117.5 133.5T480-160Z"/></symbol>
  <symbol id="i-delete" viewBox="0 -960 960 960"><path d="M261-120q-24.75 0-42.37-17.63Q201-155.25 201-180v-570h-11q-12.75 0-21.37-8.68-8.63-8.67-8.63-21.5 0-12.82 8.63-21.32 8.62-8.5 21.37-8.5h158q0-13 8.63-21.5 8.62-8.5 21.37-8.5h204q12.75 0 21.38 8.62Q612-822.75 612-810h158q12.75 0 21.38 8.68 8.62 8.67 8.62 21.5 0 12.82-8.62 21.32-8.63 8.5-21.38 8.5h-11v570q0 24.75-17.62 42.37Q723.75-120 699-120H261Zm438-630H261v570h438v-570ZM418.5-274.63q8.5-8.62 8.5-21.37v-339q0-12.75-8.68-21.38-8.67-8.62-21.5-8.62-12.82 0-21.32 8.62-8.5 8.63-8.5 21.38v339q0 12.75 8.68 21.37 8.67 8.63 21.5 8.63 12.82 0 21.32-8.63Zm166 0q8.5-8.62 8.5-21.37v-339q0-12.75-8.68-21.38-8.67-8.62-21.5-8.62-12.82 0-21.32 8.62-8.5 8.63-8.5 21.38v339q0 12.75 8.68 21.37 8.67 8.63 21.5 8.63 12.82 0 21.32-8.63ZM261-750v570-570Z"/></symbol>

</svg>

<button class="fab" id="fab" type="button" data-copy-aria="home.add"><svg class="icon" aria-hidden="true"><use href="#i-add"/></svg></button>

<!-- STEP 1 — CAMERA ──────────────────────── -->
<div id="camera-overlay" class="overlay" role="dialog" data-copy-aria="camera.label">
  <button class="btn-close" id="camera-close" type="button" data-copy-aria="common.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  <video id="camera-video" autoplay playsinline muted poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
  <div class="cam-denied" id="cam-denied">
    <svg class="icon icon--hero" aria-hidden="true"><use href="#i-photo-camera"/></svg>
    <p data-copy="camera.blocked"></p>
  </div>
  <div class="cam-controls">
    <button id="gallery-btn" type="button" data-copy-aria="camera.gallery"><svg class="icon" aria-hidden="true"><use href="#i-photo-library"/></svg></button>
    <button id="shutter-btn" type="button" data-copy-aria="camera.shutter"></button>
    <span class="cam-spacer"></span>
  </div>
  <input type="file" id="gallery-input" accept="image/*" hidden />
</div>

<!-- STEP 2 — PROCESSING ──────────────────── -->
<div id="processing-overlay" class="overlay" role="status" aria-live="polite">
  <div class="progress" role="progressbar" aria-labelledby="processing-label"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="progress__track" cx="50" cy="50" r="44" />
      <circle class="progress__indicator" id="progress-bar" cx="50" cy="50" r="44" />
    </svg>
    <span class="progress__pct" id="progress-pct" aria-hidden="true">0%</span>
  </div>
  <p class="processing-label" id="processing-label" data-copy="processing.cutting"></p>
  <p class="processing-sub" id="processing-sub"></p>
</div>

<!-- STEP 3 — REVIEW ──────────────────────── -->
<div id="review-overlay" class="overlay" role="dialog" data-copy-aria="review.label">
  <!-- the original photo, blurred, fading away as the cut-out lifts off it -->
  <div class="review-backdrop" id="review-backdrop" aria-hidden="true"></div>
  <button class="btn-close" id="review-close" type="button" data-copy-aria="common.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  <div class="screen">
    <div class="review-img-wrap">
      <img class="sticker" id="review-img" src="" data-copy-alt="review.photo" />
    </div>
    <input class="name-field review-name" id="name-input" type="text" data-copy-placeholder="review.namePlaceholder" data-copy-aria="review.name"
           maxlength="40" autocomplete="off" autocorrect="off"
           autocapitalize="none" spellcheck="false" />
    <div class="review-actions snackbar-anchor">
      <button class="btn-round" id="retake-btn" type="button" data-copy-aria="review.retake"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
      <button class="btn-primary review-save" id="save-btn" type="button" data-copy="review.save"></button>
    </div>
  </div>
</div>

<!-- DETAIL VIEW ──────────────────────────── -->
<div id="detail-overlay" class="overlay" role="dialog" data-copy-aria="detail.label">
  <button class="btn-close" id="detail-close" type="button" data-copy-aria="common.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  <div class="screen screen--scroll">
    <div class="screen__content">
      <!-- the cut-out tilts with the phone (js/tilt.js); the sheen is clipped to its shape -->
      <div class="detail-img-wrap">
        <div class="tilt" id="detail-tilt">
          <img class="sticker" id="detail-img" src="" alt="" />
          <div class="sheen" id="detail-sheen" aria-hidden="true"></div>
        </div>
      </div>
      <!-- placard, like a gallery wall label: name, exhibit number + date found, the story -->
      <div class="placard">
        <input class="name-field placard__name" id="detail-name" data-copy-aria="detail.name" maxlength="60"
               autocomplete="off" spellcheck="false" />
        <p class="placard__meta overline" id="detail-meta"></p>
        <hr class="placard__rule" />
        <textarea class="story" id="detail-note" rows="1" maxlength="1000"
                  data-copy-placeholder="detail.storyPlaceholder" data-copy-aria="detail.story"></textarea>
      </div>
      <button class="btn-round detail-delete snackbar-anchor" id="detail-delete" type="button" data-copy-aria="detail.remove"><svg class="icon" aria-hidden="true"><use href="#i-delete"/></svg></button>
    </div>
  </div>
</div>

<!-- SNACKBAR ─────────────────────────────── -->
<div class="snackbar" id="snackbar" role="status" aria-live="polite">
  <p class="snackbar__text" id="snackbar-text"></p>
  <button class="snackbar__action" id="snackbar-action" type="button" hidden></button>
</div>

<canvas id="capture-canvas" style="display:none"></canvas>

<script src="vendor/native.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
