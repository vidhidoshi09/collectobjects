name: Android APK

# Every push builds a debug APK (artifact). Pushing a version tag (v1.0.0, …)
# also publishes a GitHub Release with the APK attached, for testers.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: collectobjects-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Name the APK for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "collectobjects-${GITHUB_REF_NAME}.apk"

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: collectobjects ${{ github.ref_name }}
          files: collectobjects-${{ github.ref_name }}.apk
          body: |
            **collectobjects — for your trinkets.** A test build for Android.

            **Install**
            1. On your Android phone, download `collectobjects-${{ github.ref_name }}.apk` below.
            2. Open it. If asked, allow "Install unknown apps" for your browser or Files app (Samsung: turn off Auto Blocker while installing).
            3. Open collectobjects and snap something you love.

            Your photos stay on your phone: no account, no ads, no analytics.
