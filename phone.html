<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Preview</title>
  <!-- Dev-only preview: shows index.html inside a phone frame and reloads it when the file changes.
       Not copied into the Android app (scripts/build-web.js only copies index.html and assets/). -->
  <style>
    :root {
      --phone-w: 393px;
      --phone-h: 852px;
      --bezel: 12px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #2b2b2b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #aaa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    #phone {
      width: calc(var(--phone-w) + var(--bezel) * 2);
      height: calc(var(--phone-h) + var(--bezel) * 2);
      padding: var(--bezel);
      border-radius: 56px;
      background: #111;
      box-shadow: 0 0 0 2px #444, 0 20px 60px rgba(0,0,0,0.5);
      position: relative;
      transform-origin: center center;
      flex-shrink: 0;
    }
    #phone::before { /* camera notch */
      content: '';
      position: absolute;
      top: calc(var(--bezel) + 11px);
      left: 50%;
      width: 120px;
      height: 34px;
      margin-left: -60px;
      border-radius: 20px;
      background: #000;
      z-index: 2;
      pointer-events: none;
    }
    iframe {
      width: var(--phone-w);
      height: var(--phone-h);
      border: 0;
      border-radius: 44px;
      background: #fff;
      display: block;
    }
    #bar {
      font-size: 12px;
      padding: 8px 0 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    #bar button {
      background: #3a3a3a;
      color: #ddd;
      border: 0;
      border-radius: 6px;
      padding: 4px 10px;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="phone">
      <iframe id="screen" src="index.html" allow="camera"></iframe>
    </div>
  </div>
  <div id="bar">
    <span id="status">Watching index.html for changes…</span>
    <button id="reload" type="button">Reload</button>
  </div>

  <script>
    const phone  = document.getElementById('phone');
    const stage  = document.getElementById('stage');
    const screen = document.getElementById('screen');
    const status = document.getElementById('status');

    // Shrink the phone to fit the panel, never enlarge it
    function fit() {
      const scale = Math.min(1,
        stage.clientWidth  / phone.offsetWidth,
        stage.clientHeight / phone.offsetHeight);
      phone.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fit);
    fit();

    function reload() {
      screen.contentWindow.location.reload();
      status.textContent = 'Reloaded at ' + new Date().toLocaleTimeString();
    }
    document.getElementById('reload').addEventListener('click', reload);

    // Poll index.html and reload the phone when its contents change
    let last = null;
    async function check() {
      try {
        const text = await (await fetch('index.html', { cache: 'no-store' })).text();
        if (last !== null && text !== last) reload();
        last = text;
      } catch {
        status.textContent = 'Server not reachable — is npm start running?';
      }
    }
    setInterval(check, 1000);
    check();
  </script>
</body>
</html>
